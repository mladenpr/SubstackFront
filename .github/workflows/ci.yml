name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Parses every shipped script, exercises the background worker against a
      # Safari-shaped API stub, and builds + validates the Safari manifest.
      # No dependencies: the suite uses node:test and node:assert only.
      - name: Run tests
        run: node --test

      - name: Lint the shell scripts
        run: shellcheck safari/build.sh scripts/*.sh

      # Every green build leaves behind an upload-ready Chrome package, so
      # releasing never means hand-zipping and hoping the layout is right.
      - name: Package the Chrome build
        run: ./scripts/build-chrome.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error
