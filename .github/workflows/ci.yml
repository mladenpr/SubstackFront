name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Parses every shipped script, exercises the background worker against a
      # Safari-shaped API stub, and builds + validates the Safari manifest.
      # No dependencies: the suite uses node:test and node:assert only.
      - name: Run tests
        run: node --test

      - name: Lint the Safari build script
        run: shellcheck safari/build.sh
